name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Turbo remote cache. Set repo secret TURBO_TOKEN and repo variable TURBO_TEAM
  # to enable (Vercel: https://vercel.com/docs/monorepos/remote-caching; for a
  # self-hosted cache also set TURBO_API). Empty = local cache only (no-op).
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Base for `--affected`: the PR base on pull_request, the prior commit on push.
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  quality:
    name: Verify Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `--affected` can diff against the base

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        env:
          NODE_NO_WARNINGS: 1
        run: yarn install --frozen-lockfile --ignore-engines 2>&1 | grep -v "^warning"

      # Affected-only: only packages changed since the base (and their dependents)
      # run; everything else is a remote-cache hit. Keeps the green signal fast.
      - name: Lint (affected)
        run: yarn turbo run lint --affected

      - name: Check types (affected)
        run: yarn turbo run check-types --affected

      - name: Run unit tests (affected)
        run: yarn turbo run test:coverage --affected

  e2e:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        env:
          NODE_NO_WARNINGS: 1
        run: yarn install --frozen-lockfile --ignore-engines 2>&1 | grep -v "^warning"

      - name: Detect e2e specs
        id: specs
        # The starter ships no e2e specs. Only install the browser and run
        # Playwright when specs exist — this keeps the required check a fast,
        # reliable success and avoids the (slow, occasionally flaky) browser
        # download on every build until there are actually tests to run.
        run: |
          count=$(find apps/web/src/test/e2e -type f \
            \( -name '*.spec.ts' -o -name '*.spec.tsx' \
               -o -name '*.test.ts' -o -name '*.test.tsx' \) 2>/dev/null | wc -l)
          echo "Found $count e2e spec file(s)."
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        if: steps.specs.outputs.found == 'true'
        working-directory: apps/web
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: steps.specs.outputs.found == 'true'
        run: yarn workspace @repo/web run test:e2e
        env:
          SANITY_STUDIO_PROJECT_ID: test
          SANITY_STUDIO_DATASET_ID: production

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && steps.specs.outputs.found == 'true'
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  bundle-size:
    name: Verify Bundle Size
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        env:
          NODE_NO_WARNINGS: 1
        run: yarn install --frozen-lockfile --ignore-engines 2>&1 | grep -v "^warning"

      - name: Build application
        run: yarn turbo run build --filter=@repo/web
        env:
          SANITY_STUDIO_PROJECT_ID: test
          SANITY_STUDIO_DATASET_ID: production

      - name: Check bundle size
        run: yarn workspace @repo/web run size-limit
