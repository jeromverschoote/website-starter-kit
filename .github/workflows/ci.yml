name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Verify Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        env:
          NODE_NO_WARNINGS: 1
        run: yarn install --frozen-lockfile --ignore-engines 2>&1 | grep -v "^warning"

      - name: Lint source files
        run: yarn lint

      - name: Check types
        run: |
          yarn workspace @repo/web run check-types
          yarn workspace @repo/ui run check-types

      - name: Run unit tests
        run: |
          yarn workspace @repo/web run test:coverage
          yarn workspace @repo/ui run test:coverage
          yarn workspace @repo/data run test:coverage

  e2e:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        env:
          NODE_NO_WARNINGS: 1
        run: yarn install --frozen-lockfile --ignore-engines 2>&1 | grep -v "^warning"

      - name: Detect e2e specs
        id: specs
        # The starter ships no e2e specs. Only install the browser and run
        # Playwright when specs exist — this keeps the required check a fast,
        # reliable success and avoids the (slow, occasionally flaky) browser
        # download on every build until there are actually tests to run.
        run: |
          count=$(find apps/web/src/test/e2e -type f \
            \( -name '*.spec.ts' -o -name '*.spec.tsx' \
               -o -name '*.test.ts' -o -name '*.test.tsx' \) 2>/dev/null | wc -l)
          echo "Found $count e2e spec file(s)."
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        if: steps.specs.outputs.found == 'true'
        working-directory: apps/web
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: steps.specs.outputs.found == 'true'
        run: yarn workspace @repo/web run test:e2e
        env:
          SANITY_STUDIO_PROJECT_ID: test
          SANITY_STUDIO_DATASET_ID: production

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && steps.specs.outputs.found == 'true'
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  bundle-size:
    name: Verify Bundle Size
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        env:
          NODE_NO_WARNINGS: 1
        run: yarn install --frozen-lockfile --ignore-engines 2>&1 | grep -v "^warning"

      - name: Build application
        run: yarn workspace @repo/web run build
        env:
          SANITY_STUDIO_PROJECT_ID: test
          SANITY_STUDIO_DATASET_ID: production

      - name: Check bundle size
        run: yarn workspace @repo/web run size-limit
